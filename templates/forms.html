<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .top-buttons {
            margin-bottom: 25px;
        }

        .top-buttons button {
            padding: 10px 18px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .create-btn {
            background-color: #4CAF50;
        }

        .builder-btn {
            background-color: #673AB7;
        }

        .form-card {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .form-card h2 {
            margin-top: 0;
        }

        button {
            padding: 8px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn {
            background-color: #2196F3;
            color: white;
        }

        .archive-btn {
            background-color: #f44336;
            color: white;
        }

        .builder-small-btn {
            background-color: #673AB7;
            color: white;
        }

        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Form List</h1>

    <div class="top-buttons">
        <button class="create-btn" onclick="createForm()">
            + Create New Form
        </button>

        <button class="builder-btn" onclick="openBuilder()">
            Form Builder
        </button>
    </div>

    <div id="message"></div>

    <div id="formsList">
        Loading forms...
    </div>

</div>


<script>

async function loadForms() {

    const formsList = document.getElementById("formsList");

    try {

        const response = await fetch("/forms/");

        const forms = await response.json();

        if (!response.ok) {

            formsList.innerHTML =
                "<p>Unable to load forms.</p>";

            return;
        }

        formsList.innerHTML = "";

        if (forms.length === 0) {

            formsList.innerHTML =
                "<p>No forms found.</p>";

            return;
        }

        forms.forEach(function(form) {

            const card = document.createElement("div");

            card.className = "form-card";


            // Title

            const title = document.createElement("h2");

            title.innerText = form.title;

            card.appendChild(title);


            // Description

            const description = document.createElement("p");

            description.innerText =
                form.description || "No description";

            card.appendChild(description);


            // Form ID

            const id = document.createElement("p");

            id.innerText =
                "Form ID: " + form.id;

            card.appendChild(id);


            // Status

            const status = document.createElement("p");

            status.innerText =
                "Status: " + form.status;

            card.appendChild(status);


            // Edit button

            const editButton =
                document.createElement("button");

            editButton.innerText = "Edit";

            editButton.className = "edit-btn";


            if (form.status !== "draft") {

                editButton.disabled = true;

                editButton.className += " disabled";

            } else {

                editButton.onclick = function() {

                    window.location.href =
                        "/edit-form/" + form.id;

                };

            }


            // Archive button

            const archiveButton =
                document.createElement("button");

            archiveButton.innerText = "Archive";

            archiveButton.className = "archive-btn";


            if (form.status !== "draft") {

                archiveButton.disabled = true;

                archiveButton.className += " disabled";

            } else {

                archiveButton.onclick = function() {

                    archiveForm(form.id);

                };

            }


            // Form Builder button

            const builderButton =
                document.createElement("button");

            builderButton.innerText = "Builder";

            builderButton.className =
                "builder-small-btn";


            if (form.status !== "draft") {

                builderButton.disabled = true;

                builderButton.className += " disabled";

            } else {

                builderButton.onclick = function() {

                    window.location.href =
                        "/form-builder?form_id=" + form.id;

                };

            }


            card.appendChild(editButton);

            card.appendChild(archiveButton);

            card.appendChild(builderButton);

            formsList.appendChild(card);

        });

    }

    catch (error) {

        console.error(error);

        formsList.innerHTML =
            "<p>Error connecting to server.</p>";

    }

}


/* =========================
   CREATE FORM
========================= */

function createForm() {

    window.location.href = "/create-form";

}


/* =========================
   FORM BUILDER
========================= */

function openBuilder() {

    alert(
        "Please select a draft form and click Builder."
    );

}


/* =========================
   ARCHIVE FORM
========================= */

async function archiveForm(formId) {

    const message =
        document.getElementById("message");

    try {

        const response =
            await fetch(
                "/forms/" + formId + "/archive",
                {
                    method: "PATCH"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            message.innerText =
                "Error: " +
                (data.detail || "Unable to archive form");

            return;
        }

        message.innerText =
            "Form archived successfully!";

        loadForms();

    }

    catch (error) {

        console.error(error);

        message.innerText =
            "Error connecting to server.";

    }

}


/* =========================
   LOAD FORMS
========================= */

loadForms();

</script>

</body>
</html>
