<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form List</title>

    <!-- =====================================================
         PWA CONFIGURATION
    ====================================================== -->

    <link rel="manifest" href="/manifest.json">

    <meta name="theme-color" content="#4f46e5">

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Workflow System"
    >


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .language-container {
            margin-bottom: 20px;
        }

        .language-container label {
            font-weight: bold;
            margin-right: 10px;
        }

        #languageSelector {
            padding: 8px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 20px;
        }

        .top-buttons {
            margin-bottom: 25px;
        }

        .top-buttons button {
            padding: 10px 18px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .create-btn {
            background-color: #4CAF50;
        }

        .builder-btn {
            background-color: #673AB7;
        }

        .form-card {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .form-card h2 {
            margin-top: 0;
        }

        button {
            padding: 8px 15px;
            margin-right: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn {
            background-color: #2196F3;
            color: white;
        }

        .archive-btn {
            background-color: #f44336;
            color: white;
        }

        .builder-small-btn {
            background-color: #673AB7;
            color: white;
        }

        .analytics-btn {
            background-color: #00897B;
            color: white;
        }

        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            margin-bottom: 20px;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <!-- =====================================================
         LANGUAGE SELECTOR
    ====================================================== -->

    <div class="language-container">

        <label
            for="languageSelector"
            data-i18n="language">
            Language
        </label>

        <select id="languageSelector">

            <option
                value="en"
                data-i18n="english">
                English
            </option>

            <option
                value="te"
                data-i18n="telugu">
                Telugu
            </option>

            <option
                value="hi"
                data-i18n="hindi">
                Hindi
            </option>

            <option
                value="ta"
                data-i18n="tamil">
                Tamil
            </option>

        </select>

    </div>


    <!-- =====================================================
         FORM LIST
    ====================================================== -->

    <h1
        data-i18n="formList">
        Form List
    </h1>


    <!-- =====================================================
         TOP BUTTONS
    ====================================================== -->

    <div class="top-buttons">

        <button
            class="create-btn"
            onclick="createForm()"
            data-i18n="createNewForm">
            + Create New Form
        </button>

        <button
            class="builder-btn"
            onclick="openBuilder()"
            data-i18n="formBuilder">
            Form Builder
        </button>

    </div>


    <div id="message"></div>


    <div id="formsList">
        Loading forms...
    </div>

</div>


<!-- =========================================================
     LANGUAGE SCRIPT
========================================================= -->

<script src="/static/language.js"></script>


<script>

/* =========================================================
   LOAD FORMS
========================================================= */

async function loadForms() {

    const formsList =
        document.getElementById("formsList");

    try {

        const response =
            await fetch("/forms/");

        const forms =
            await response.json();

        if (!response.ok) {

            formsList.innerHTML =
                "<p data-i18n='unableToLoadForms'>Unable to load forms.</p>";

            applyCurrentLanguage();

            return;
        }

        formsList.innerHTML = "";

        if (forms.length === 0) {

            formsList.innerHTML =
                "<p data-i18n='noFormsFound'>No forms found.</p>";

            applyCurrentLanguage();

            return;
        }

        forms.forEach(function(form) {

            const card =
                document.createElement("div");

            card.className =
                "form-card";


            /* =================================================
               TITLE
            ================================================= */

            const title =
                document.createElement("h2");

            title.innerText =
                form.title;

            card.appendChild(title);


            /* =================================================
               DESCRIPTION
            ================================================= */

            const description =
                document.createElement("p");

            description.innerText =
                form.description ||
                getTranslation("noDescription");

            card.appendChild(description);


            /* =================================================
               FORM ID
            ================================================= */

            const id =
                document.createElement("p");

            id.innerText =
                getTranslation("formId") +
                ": " +
                form.id;

            card.appendChild(id);


            /* =================================================
               STATUS
            ================================================= */

            const status =
                document.createElement("p");

            status.innerText =
                getTranslation("status") +
                ": " +
                form.status;

            card.appendChild(status);


            /* =================================================
               EDIT BUTTON
            ================================================= */

            const editButton =
                document.createElement("button");

            editButton.innerText =
                getTranslation("edit");

            editButton.className =
                "edit-btn";


            if (form.status !== "draft") {

                editButton.disabled = true;

                editButton.className +=
                    " disabled";

            } else {

                editButton.onclick =
                    function() {

                        window.location.href =
                            "/edit-form/" +
                            form.id;

                    };

            }


            /* =================================================
               ARCHIVE BUTTON
            ================================================= */

            const archiveButton =
                document.createElement("button");

            archiveButton.innerText =
                getTranslation("archive");

            archiveButton.className =
                "archive-btn";


            if (form.status !== "draft") {

                archiveButton.disabled = true;

                archiveButton.className +=
                    " disabled";

            } else {

                archiveButton.onclick =
                    function() {

                        archiveForm(
                            form.id
                        );

                    };

            }


            /* =================================================
               BUILDER BUTTON
            ================================================= */

            const builderButton =
                document.createElement("button");

            builderButton.innerText =
                getTranslation("builder");

            builderButton.className =
                "builder-small-btn";


            if (form.status !== "draft") {

                builderButton.disabled = true;

                builderButton.className +=
                    " disabled";

            } else {

                builderButton.onclick =
                    function() {

                        window.location.href =
                            "/form-builder?form_id=" +
                            form.id;

                    };

            }


            /* =================================================
               ANALYTICS BUTTON
            ================================================= */

            const analyticsButton =
                document.createElement("button");

            analyticsButton.innerText =
                getTranslation("analytics");

            analyticsButton.className =
                "analytics-btn";


            analyticsButton.onclick =
                function() {

                    window.location.href =
                        "/analytics/" +
                        form.id;

                };


            /* =================================================
               ADD BUTTONS TO CARD
            ================================================= */

            card.appendChild(editButton);

            card.appendChild(archiveButton);

            card.appendChild(builderButton);

            card.appendChild(analyticsButton);

            formsList.appendChild(card);

        });

    }

    catch (error) {

        console.error(error);

        formsList.innerHTML =
            "<p data-i18n='serverError'>Error connecting to server.</p>";

        applyCurrentLanguage();

    }

}


/* =========================================================
   TRANSLATION STORAGE
========================================================= */

let currentTranslations = {};


/* =========================================================
   GET TRANSLATION
========================================================= */

function getTranslation(key) {

    return currentTranslations[key] || key;

}


/* =========================================================
   APPLY CURRENT LANGUAGE
========================================================= */

function applyCurrentLanguage() {

    const selectedLanguage =
        localStorage.getItem("selectedLanguage") || "en";

    loadTranslationsForForms(
        selectedLanguage
    );

}


/* =========================================================
   LOAD TRANSLATIONS
========================================================= */

async function loadTranslationsForForms(language) {

    try {

        const response =
            await fetch(
                "/static/i18n/" +
                language +
                ".json"
            );

        if (!response.ok) {

            throw new Error(
                "Language file not found"
            );

        }

        currentTranslations =
            await response.json();

        updateStaticText();

        loadForms();

    }

    catch (error) {

        console.error(
            "Translation loading failed:",
            error
        );

        currentTranslations = {};

        loadForms();

    }

}


/* =========================================================
   UPDATE STATIC TEXT
========================================================= */

function updateStaticText() {

    document
        .querySelectorAll("[data-i18n]")
        .forEach(function(element) {

            const key =
                element.getAttribute("data-i18n");

            if (currentTranslations[key]) {

                element.textContent =
                    currentTranslations[key];

            }

        });


    const languageSelector =
        document.getElementById(
            "languageSelector"
        );

    if (languageSelector) {

        languageSelector.value =
            localStorage.getItem(
                "selectedLanguage"
            ) || "en";

    }

}


/* =========================================================
   LANGUAGE SELECTOR
========================================================= */

document
    .getElementById("languageSelector")
    .addEventListener(
        "change",
        function(event) {

            const language =
                event.target.value;

            localStorage.setItem(
                "selectedLanguage",
                language
            );

            loadTranslationsForForms(
                language
            );

        }
    );


/* =========================================================
   CREATE FORM
========================================================= */

function createForm() {

    window.location.href =
        "/create-form";

}


/* =========================================================
   FORM BUILDER
========================================================= */

function openBuilder() {

    alert(
        getTranslation("builderMessage")
    );

}


/* =========================================================
   ARCHIVE FORM
========================================================= */

async function archiveForm(formId) {

    const message =
        document.getElementById("message");

    try {

        const response =
            await fetch(
                "/forms/" +
                formId +
                "/archive",
                {
                    method: "PATCH"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            message.innerText =
                getTranslation("error") +
                ": " +
                (
                    data.detail ||
                    getTranslation(
                        "unableToArchive"
                    )
                );

            return;
        }

        message.innerText =
            getTranslation(
                "archiveSuccess"
            );

        loadForms();

    }

    catch (error) {

        console.error(error);

        message.innerText =
            getTranslation(
                "serverError"
            );

    }

}


/* =========================================================
   START
========================================================= */

const savedLanguage =
    localStorage.getItem(
        "selectedLanguage"
    ) || "en";

loadTranslationsForForms(
    savedLanguage
);

</script>


<!-- =========================================================
     PWA SERVICE WORKER
========================================================= -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function () {

            navigator.serviceWorker
                .register("/sw.js")
                .then(
                    function (registration) {

                        console.log(
                            "Service Worker registered:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    function (error) {

                        console.error(
                            "Service Worker registration failed:",
                            error
                        );

                    }
                );

        }
    );

}

</script>


</body>

</html>
