<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .language-container {
            margin-bottom: 20px;
        }

        .language-container label {
            display: inline-block;
            margin: 0 10px 0 0;
            font-weight: bold;
        }

        #languageSelector {
            padding: 8px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        .back-btn {
            background-color: #777;
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LANGUAGE SELECTOR -->

    <div class="language-container">

        <label
            for="languageSelector"
            data-i18n="language">
            Language
        </label>

        <select id="languageSelector">

            <option
                value="en"
                data-i18n="english">
                English
            </option>

            <option
                value="te"
                data-i18n="telugu">
                Telugu
            </option>

            <option
                value="hi"
                data-i18n="hindi">
                Hindi
            </option>

            <option
                value="ta"
                data-i18n="tamil">
                Tamil
            </option>

        </select>

    </div>


    <!-- PAGE TITLE -->

    <h1 data-i18n="createFormTitle">
        Create Form
    </h1>


    <form id="createForm">

        <!-- FORM TITLE -->

        <label
            for="title"
            data-i18n="formTitle">
            Form Title
        </label>

        <input
            type="text"
            id="title"
            placeholder="Enter form title"
            data-i18n-placeholder="enterFormTitle"
            required
        >


        <!-- DESCRIPTION -->

        <label
            for="description"
            data-i18n="description">
            Description
        </label>

        <textarea
            id="description"
            placeholder="Enter form description"
            data-i18n-placeholder="enterFormDescription"
        ></textarea>


        <!-- CREATED BY -->

        <label
            for="created_by"
            data-i18n="createdBy">
            Created By (User ID)
        </label>

        <input
            type="text"
            id="created_by"
            placeholder="Enter user UUID"
            data-i18n-placeholder="enterUserUUID"
            required
        >


        <!-- CREATE BUTTON -->

        <button
            type="submit"
            data-i18n="createFormButton">
            Create Form
        </button>


        <!-- BACK BUTTON -->

        <button
            type="button"
            class="back-btn"
            onclick="goBack()"
            data-i18n="back">
            Back
        </button>

    </form>


    <div id="message"></div>

</div>


<!-- COMMON LANGUAGE SCRIPT -->

<script src="/static/language.js"></script>


<script>

let currentTranslations = {};


/* =========================================================
   GET TRANSLATION
========================================================= */

function getTranslation(key) {

    return currentTranslations[key] || key;

}


/* =========================================================
   LOAD TRANSLATIONS
========================================================= */

async function loadTranslations(language) {

    try {

        const response =
            await fetch(
                "/static/i18n/" +
                language +
                ".json"
            );

        if (!response.ok) {

            throw new Error(
                "Language file not found"
            );

        }

        currentTranslations =
            await response.json();


        updatePageText();


    }

    catch (error) {

        console.error(
            "Translation loading failed:",
            error
        );

        currentTranslations = {};

    }

}


/* =========================================================
   UPDATE PAGE TEXT
========================================================= */

function updatePageText() {

    /* Update normal text */

    document
        .querySelectorAll("[data-i18n]")
        .forEach(function(element) {

            const key =
                element.getAttribute(
                    "data-i18n"
                );

            if (currentTranslations[key]) {

                element.textContent =
                    currentTranslations[key];

            }

        });


    /* Update placeholders */

    document
        .querySelectorAll(
            "[data-i18n-placeholder]"
        )
        .forEach(function(element) {

            const key =
                element.getAttribute(
                    "data-i18n-placeholder"
                );

            if (currentTranslations[key]) {

                element.placeholder =
                    currentTranslations[key];

            }

        });


    /* Update selected language */

    const languageSelector =
        document.getElementById(
            "languageSelector"
        );

    if (languageSelector) {

        languageSelector.value =
            localStorage.getItem(
                "selectedLanguage"
            ) || "en";

    }

}


/* =========================================================
   LANGUAGE SELECTOR
========================================================= */

document
    .getElementById("languageSelector")
    .addEventListener(
        "change",
        function(event) {

            const language =
                event.target.value;

            localStorage.setItem(
                "selectedLanguage",
                language
            );

            loadTranslations(
                language
            );

        }
    );


/* =========================================================
   CREATE FORM
========================================================= */

document
    .getElementById("createForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const title =
                document
                    .getElementById("title")
                    .value
                    .trim();


            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            const created_by =
                document
                    .getElementById("created_by")
                    .value
                    .trim();


            const formData = {

                title: title,

                description:
                    description || null,

                status: "draft",

                created_by: created_by

            };


            const message =
                document.getElementById(
                    "message"
                );


            try {

                const response =
                    await fetch(
                        "/forms/",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    formData
                                )
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    message.innerText =
                        getTranslation(
                            "error"
                        ) +
                        ": " +
                        (
                            result.detail ||
                            getTranslation(
                                "failedToCreateForm"
                            )
                        );

                    return;

                }


                message.innerText =
                    getTranslation(
                        "formCreatedSuccess"
                    );


                /*
                 * Wait briefly and return
                 * to Form List page.
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            "/forms-page";

                    },
                    1000
                );

            }


            catch (error) {

                console.error(error);

                message.innerText =
                    getTranslation(
                        "serverError"
                    );

            }

        }
    );


/* =========================================================
   BACK BUTTON
========================================================= */

function goBack() {

    window.location.href =
        "/forms-page";

}


/* =========================================================
   START
========================================================= */

const savedLanguage =
    localStorage.getItem(
        "selectedLanguage"
    ) || "en";


loadTranslations(
    savedLanguage
);

</script>

</body>

</html>
