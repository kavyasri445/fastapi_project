<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .language-container {
            margin-bottom: 20px;
        }

        .language-container label {
            font-weight: bold;
            margin-right: 10px;
        }

        #languageSelector {
            padding: 8px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }

        button {
            padding: 8px 15px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <div class="language-container">
        <label for="languageSelector" data-i18n="language">
            Language
        </label>

        <select id="languageSelector">
            <option value="en" data-i18n="english">
                English
            </option>

            <option value="te" data-i18n="telugu">
                Telugu
            </option>

            <option value="hi" data-i18n="hindi">
                Hindi
            </option>

            <option value="ta" data-i18n="tamil">
                Tamil
            </option>
        </select>
    </div>


    <h1 data-i18n="formList">
        Form List
    </h1>


    <button onclick="loadForms()" data-i18n="refreshForms">
        Refresh Forms
    </button>


    <table>
        <thead>
            <tr>
                <th data-i18n="titleColumn">Title</th>
                <th data-i18n="descriptionColumn">Description</th>
                <th data-i18n="statusColumn">Status</th>
                <th data-i18n="formIdColumn">Form ID</th>
            </tr>
        </thead>

        <tbody id="formsTableBody">
            <tr>
                <td colspan="4" data-i18n="loading">
                    Loading...
                </td>
            </tr>
        </tbody>
    </table>


    <!-- Multilingual JavaScript -->
    <script src="/static/language.js"></script>


    <script>

        async function loadForms() {

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/forms"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch forms");
                }

                const forms = await response.json();

                const tableBody =
                    document.getElementById("formsTableBody");

                tableBody.innerHTML = "";

                forms.forEach(form => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${form.title}</td>
                        <td>${form.description || ""}</td>
                        <td>${form.status}</td>
                        <td>${form.id}</td>
                    `;

                    tableBody.appendChild(row);
                });

            } catch (error) {

                console.error(error);

                document.getElementById("formsTableBody").innerHTML = `
                    <tr>
                        <td colspan="4" data-i18n="errorLoadingForms">
                            Error loading forms
                        </td>
                    </tr>
                `;

                /*
                 * Re-apply the currently selected language
                 * to the newly created error message.
                 */
                const selectedLanguage =
                    localStorage.getItem("selectedLanguage") || "en";

                if (typeof loadLanguage === "function") {
                    loadLanguage(selectedLanguage);
                }
            }
        }


        loadForms();

    </script>

</body>
</html>
